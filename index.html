<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#root{min-height:100%;height:auto;overflow-x:hidden;overflow-y:auto}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
.card-scene{perspective:1200px}
.card-body{transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1);cursor:pointer}
.card-body.flipped{transform:rotateY(180deg)}
.card-face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card-back{transform:rotateY(180deg)}
.etymology{font-size:12px;color:#94a3b8;margin:6px 0 8px;line-height:1.5;text-align:left;width:100%}
.et-title{font-size:10px;font-weight:800;color:#facc15;letter-spacing:.7px;margin-bottom:5px}
.et-parts{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.et-part{background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.24);border-radius:7px;padding:5px 7px;min-width:0;flex:1 1 86px}
.et-piece{font-size:12px;font-weight:800;color:#f8fafc;line-height:1.25;word-break:break-word}
.et-meaning{font-size:10px;color:#cbd5e1;line-height:1.35;margin-top:2px}
.et-hint{font-size:11px;color:#f8fafc;background:rgba(255,255,255,.05);border-left:3px solid #facc15;border-radius:6px;padding:6px 8px;margin-bottom:5px}
.et-source{font-size:10px;color:#94a3b8;font-style:italic;line-height:1.45}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes correct{0%{box-shadow:0 0 0 0 rgba(52,211,153,.4)}100%{box-shadow:0 0 0 16px rgba(52,211,153,0)}}
.slide-up{animation:slideUp .35s ease}
.progress-bar{height:3px;background:#1e293b;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#e91e8c,#f43f5e);border-radius:2px;transition:width .5s ease}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:#0f172a}
::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
.btn{transition:all .15s ease}
.btn:active{transform:scale(.95)}
input,textarea{font-family:inherit}
</style>
</head>

<script type="text/babel">
const{useState,useEffect,useCallback,useRef,useMemo}=React;

// ===== 単語データ (動画OCRより抽出 3042語) =====
const BASE_WORDS=[
  {id:1,w:"being",m:"存在；生き物",et:"Originated 1250–1300 ← 中英語 being; see be + -ing",e:"As a human being, one has the right to access clean water and basic education.",ej:"人間として、誰もが清潔な水と基礎教育にアクセスする権利を持っている。"},
  {id:2,w:"government",m:"政府；統治",et:"由来: 中英語 governement ← 古フランス語 governement (modern フランス語 gouvernement) ← governer (see govern) + -ment. Morphologically govern +‎ -ment. Displaced native 古英語 gerec, leod...",e:"The government introduced new policies to curb rising carbon emissions.",ej:"政府はインフレ抑制のため、一連の新しい政策を導入した。"},
  {id:3,w:"found",m:"を設立する",et:"See find / 由来: 中英語 founden ← 古フランス語 founder (Modern フランス語: fonder) ← ラテン語 fundāre",e:"The organisation was founded in 1990 to promote global sustainable development.",ej:"その団体は1990年に、持続可能な開発を促進するために設立された。"},
  {id:4,w:"given",m:"〜を仮定すれば",et:"Morphologically give +‎ -n",e:"Given the evidence available, it is difficult to draw a definitive conclusion.",ej:"入手可能な証拠を踏まえると、確定的な結論を導くことは難しい。"},
  {id:5,w:"state",m:"状態；国家；述べる",et:"由来: 中英語 stat (as a noun); adopted c. 1200 ← both 古フランス語 estat and ラテン語 stātus (“manner of standing, attitude, position, carriage, manner, dress, apparel; and other sen...",e:"The report states that average global temperatures have risen by 1.1 degrees Celsius.",ej:"報告書は、世界の平均気温が1.1度上昇したと述べている。"},
  {id:6,w:"council",m:"議会；評議会",et:"継承: 中英語 counseil ← 古フランス語 conseil ← late ラテン語 cōnsilium; with the spelling in -c- adopted after ラテン語 concilium in Early 現代英語, though some senses of counseil were influ...",e:"The city council approved new regulations to reduce plastic waste in public spaces.",ej:"市議会は公共スペースにおけるプラスチック廃棄物削減の新規制を承認した。"},
  {id:7,w:"available",m:"利用可能な",et:"由来: 中英語 available, avayllable, avayleable, equivalent of avail +‎ -able",e:"Affordable housing is not readily available in many of the world's major cities.",ej:"世界の主要都市の多くでは、手頃な価格の住宅が容易には手に入らない。"},
  {id:9,w:"means",m:"手段，方法",et:"由来: mean (“method or course of action used to achieve some result”)",e:"Education means far more than acquiring facts; it fosters critical thinking skills.",ej:"教育とは事実を習得すること以上であり、批判的思考力を育むものだ。"},
  {id:10,w:"likely",m:"ありそうな；予想される",et:"由来: 中英語 likely, likly, lykly, likliche ← 古英語 ġelīclīċ (“suitable”) and 古ノルド語 líkligr (“likely”) (probably independent formations), 構成: like +‎ -ly (adjectival suffix) / 由来: 中英語 likely, likly, lykly, likliche ← 古英語 ġelīclīċe (“equally”) and 古ノルド語 líkliga, glíkliga (“likely”), both ← ゲルマン祖語 *līkalīka, 構成: like +‎ -ly (adverbial suffix)",e:"Developing nations are more likely to be severely affected by climate change.",ej:"気候変動の深刻な影響を受ける可能性が高いのは、発展途上国である。"},
  {id:11,w:"therefore",m:"それ故に，従って",et:"由来: 中英語 therfore, therfor, tharfore, thorfore; synchronically a univerbation of there (pronominal adverb) +‎ for, literally “for that (reason)”. The spelling has been...",e:"The sample size was too small; therefore, the results cannot be generalised.",ej:"サンプルサイズが小さすぎたため、結果を一般化することはできない。"},
  {id:12,w:"evidence",m:"証拠；根拠",et:"由来: 中英語 evidence ← 古フランス語 ← ラテン語 evidentia (“clearness, in 後期ラテン語 a proof”) ← evidens (“clear, evident”); see evident",e:"There is compelling evidence that air pollution significantly contributes to lung disease.",ej:"大気汚染が肺疾患に大きく寄与するという説得力のある証拠がある。"},
  {id:13,w:"range",m:"範囲；幅",et:"由来: 中英語 rengen ← 古フランス語 rengier (“to range, to rank, to order,”) ← the noun renc, reng, ranc, rang (“a rank, row”) ← Frankish *hring ← ゲルマン祖語 *hringaz (“ring, circle...",e:"A wide range of factors influences academic performance among university students.",ej:"大学生の学業成績には、幅広い要因が影響を与えている。"},
  {id:14,w:"thus",m:"このようにして；したがって",et:"由来: 中英語 thus, þus ← 古英語 þus (“thus, in this way, as follows, in this manner, to this extent”) ← 西ゲルマン祖語 *þus (“so, thus”), perhaps originally ← a variant of the instru... / thus (uncountable)",e:"Industrial output increased sharply; thus, demand for raw materials rose accordingly.",ej:"工業生産が急増したため、原材料の需要も相応に増加した。"},
  {id:15,w:"individual",m:"個人；個別の",et:"由来: 中世ラテン語 indīviduālis ← ラテン語 indīviduum (“an indivisible thing”), neuter of indīviduus (“indivisible, undivided”) ← in + dīviduus (“divisible”) ← dīvidō (“divide”)",e:"Each individual has a responsibility to reduce their personal carbon footprint.",ej:"個人一人ひとりが、自らの環境への影響を軽減する責任を持っている。"},
  {id:16,w:"committee",m:"委員会",et:"由来: commit +‎ -ee, or else revival of アングロノルマン語 commite, past participle of commettre (“to commit”) ← ラテン語 committere ← con- (“with”) + mittere (“to send”). The OED3 p...",e:"The committee reviewed all proposals and recommended further environmental reforms.",ej:"委員会はすべての提案を審査し、さらなる環境改革を勧告した。"},
  {id:17,w:"indeed",m:"実際に；確かに",et:"由来: 中英語 indede, univerbation of the phrase in dede (“in sooth, in fact”). Cognate with Saterland Frisian innerdoat, innedoat (“indeed”), West Frisian yndied (“indeed”)...",e:"The findings were indeed consistent with those of previous research on the subject.",ej:"その調査結果は、これまでの研究と確かに一致していた。"},
  {id:18,w:"authority",m:"権威；当局",et:"由来: 中英語 auctorite, autorite (“authority, book or quotation that settles an argument”) ← 古フランス語 auctorité ← ラテン語 stem of auctōritās (“invention, advice, opinion, influe...",e:"The regulatory authority imposed stricter limits on industrial waste disposal.",ej:"規制当局は産業廃棄物処理に関してより厳しい基準を課した。"},
  {id:19,w:"union",m:"組合；連合",et:"由来: 中英語 unyoun ← 古フランス語 union ← 後期ラテン語 ūniō, ūniōnem (“oneness, unity”) ← ラテン語 ūnus (“one”)",e:"The European Union has set ambitious targets for achieving carbon neutrality by 2050.",ej:"欧州連合は2050年までにカーボンニュートラルを達成するという野心的な目標を設定した。"},
  {id:20,w:"figure",m:"数字；人物；考える",et:"由来: 中英語 figure, borrowed ← 古フランス語 figure ← ラテン語 figūra (“form, shape, form of a word, a figure of speech, 後期ラテン語 a sketch, drawing”) ← fingō (“to form, shape, mold, fa...",e:"Official figures show that the unemployment rate has declined to a five-year low.",ej:"公式データによると、失業率は5年ぶりの低水準まで低下した。"},
  {id:21,w:"practice",m:"練習；実践；習慣",et:"The noun is ← 中英語 practice, practique, practyse ← the verb; also",e:"Sustainable agricultural practice is essential for maintaining long-term soil quality.",ej:"持続可能な農業の実践は、長期的な土壌の質を維持するために不可欠だ。"},
  {id:22,w:"former",m:"前の；以前の",et:"継承: 中英語 former, comparative of forme (“first”) ← 古英語 forma (“first”), descended ← ゲルマン祖語 *frumô. Parallel to prior (via ラテン語), as comparative form ← same 印欧祖語 root. Re... / 継承: 中英語 formere. By surface analysis, form +‎ -er",e:"The former policy was replaced after widespread criticism from environmental groups.",ej:"前の政策は環境団体から広く批判を受けた後、改正された。"},
  {id:23,w:"issue",m:"問題；号",et:"由来: 中英語 issue ← 古フランス語 issue (“an exit, a way out”), feminine past participle of issir (“to exit”) ← ラテン語 exeō (“go out, exit”) ← prefix ex- (“out”) + eō (“go”)",e:"Inequality remains one of the most pressing issues in both developed and developing nations.",ej:"格差は先進国・途上国を問わず、最も差し迫った課題の一つであり続けている。"},
  {id:24,w:"stage",m:"段階；舞台",et:"由来: 中英語 stage ← 古フランス語 estage (“dwelling, residence; position, situation, condition”) ← 古フランス語 ester (“to be standing, be located”). Cognate with 古英語 stæþþan (“to make... / 借用: フランス語 stage (“internship”)",e:"At this stage of the investigation, no conclusive link has been established.",ej:"調査の現段階では、明確な関連性はまだ確立されていない。"},
  {id:26,w:"basis",m:"基礎；根拠；基盤",et:"由来: ラテン語 basis ← 古代ギリシア語 βάσις (básis) ← 印欧祖語 *gʷémtis, derived ← 印欧祖語 *gʷem- (whence also come)",e:"The policy is reviewed on an annual basis to reflect changing economic conditions.",ej:"その政策は変化する経済状況を反映するため、毎年見直されている。"},
  {id:27,w:"despite",m:"〜にもかかわらず",et:"The noun is derived ← 中英語 despit, dispit ← 古フランス語 despit ← ラテン語 dēspectum (“looking down on”) ← dēspiciō (“to look down, despise”) / 由来: 中英語 despite, dispite, dyspite, dyspyte ← 古フランス語 despitier",e:"Despite significant investment, global deforestation rates have continued to rise.",ej:"多大な投資にもかかわらず、世界の森林破壊率は上昇し続けている。"},
  {id:28,w:"structure",m:"構造；構成",et:"由来: 中期フランス語 structure ← ラテン語 structūra (“a fitting together, adjustment, building, erection, a building, edifice, structure”) ← struere, past participle structus (“pil...",e:"The economic structure of many developing nations relies heavily on primary industries.",ej:"多くの途上国の経済構造は、一次産業への依存度が高い。"},
  {id:29,w:"capital",m:"首都；資本；大文字の",et:"由来: 中英語 capital, borrowed partly ← 古フランス語 capital and partly ← ラテン語 capitālis (“of the head”) (in sense “head of cattle”) ← caput (“head”) (English cap) + -ālis (suffi... / 由来: 中英語 capitale, partly ← 古フランス語 capital and partly ← 後期ラテン語 capitellum (“capital or chapiter of a column”), a form of ラテン語 capitulum (“head-like object or structure...",e:"The capital city receives a disproportionate share of public infrastructure spending.",ej:"首都は公共インフラへの支出の不均等に大きな割合を受け取っている。"},
  {id:30,w:"per",m:"〜につき；〜ごとに",et:"由来: ラテン語 per (“through, during”) ← 印欧祖語 *per / Clipping of person, coined by American novelist and poet Marge Piercy in Woman on the Edge of Time (1979)",e:"The average household consumes approximately 3,800 kilowatts of electricity per year.",ej:"平均的な世帯は年間約3,800キロワット時の電力を消費している。"},
  {id:31,w:"agreement",m:"合意；契約",et:"由来: 中英語 agrement, agreement ← 古フランス語 agrement, agreement. Morphologically agree +‎ -ment",e:"A landmark international agreement was reached to limit global warming to 1.5 degrees.",ej:"地球温暖化を1.5度に抑える画期的な国際協定が締結された。"},
  {id:32,w:"population",m:"人口",et:"借用: 後期ラテン語 populatio (“a people, multitude”), as if a noun of action ← Classical ラテン語 populus, 構成: populate +‎ -ion",e:"The ageing population presents significant challenges to sustainable healthcare systems.",ej:"高齢化する人口は、持続可能な医療システムに重大な課題をもたらしている。"},
  {id:33,w:"legal",m:"法律の；合法的な",et:"Learned borrowing ← ラテン語 lēgālis (“legal”) ← lēx (“law”)",e:"All companies are legally required to meet strict standards for industrial waste disposal.",ej:"すべての企業は産業廃棄物処理に関する厳格な基準を法的に満たす必要がある。"},
  {id:34,w:"fine",m:"罰金；素晴らしい；細かい",et:"由来: 中英語 fin, fyn ← 古フランス語 fin (“fine, minute, exact”), of obscure origin, but probably derived ← ラテン語 fīnīre (“to finish”) or fīnis (“boundary, limit, end”), with an a... / 由来: 中英語 fyn, fyne ← 古フランス語 fin ← 中世ラテン語 fīnis (“a payment in settlement or tax”)",e:"Organisations that violate environmental regulations may face a substantial financial fine.",ej:"環境規制に違反した組織は、多額の罰金を科される可能性がある。"},
  {id:35,w:"theory",m:"理論；学説",et:"借用: 中期フランス語 théorie, a learned borrowing ← 後期ラテン語 theōria, borrowed ← 古代ギリシア語 θεωρία (theōría) ← θεωρός (theōrós, “spectator”) + -ῐ́ᾱ (-ĭ́ā)",e:"The theory of comparative advantage underpins much of modern international trade policy.",ej:"比較優位の理論は、現代の国際貿易政策の基礎をなしている。"},
  {id:36,w:"growth",m:"成長；増加",et:"由来: grow +‎ -th (abstract nominal suffix). More at grow",e:"Rapid economic growth has frequently come at the expense of environmental sustainability.",ej:"急速な経済成長はしばしば環境の持続可能性を犠牲にして実現されてきた。"},
  {id:37,w:"relationship",m:"関係；つながり",et:"由来: relation + -ship",e:"The relationship between income inequality and social mobility has been widely studied.",ej:"所得格差と社会的流動性の関係は広く研究されてきた。"},
  {id:38,w:"property",m:"財産；特性",et:"由来: 中英語 propertee, properte, propirte, proprete, borrowed ← アングロノルマン語 and 古フランス語 propreté, proprieté (“propriety, fitness, property”) ← ラテン語 proprietās (“a peculiarity...",e:"Intellectual property rights play a vital role in encouraging technological innovation.",ej:"知的財産権は技術革新を促進する上で重要な役割を果たしている。"},
  {id:39,w:"term",m:"期間；用語",et:"由来: 中英語 terme, borrowed ← 古フランス語 terme ← ラテン語 terminus (“a bound, boundary, limit, end; in 中世ラテン語, also a time, period, word, covenant, etc.”), ultimately ← 印欧祖語 *térm... / Clipping of terminal",e:"In the long term, investing in renewable energy is considerably more cost-effective.",ej:"長期的には、再生可能エネルギーへの投資は大幅にコスト効率が高い。"},
  {id:40,w:"throughout",m:"〜の至る所に；〜を通じて",et:"由来: 古英語 þurh ūt, 構成: through +‎ out",e:"Biodiversity loss has been recorded throughout tropical rainforests across the globe.",ej:"生物多様性の損失は、世界中の熱帯雨林全体で記録されている。"},
  {id:41,w:"previous",m:"前の；以前の",et:"由来: ラテン語 praevius",e:"The current study builds on the findings of previous research conducted over a decade.",ej:"現在の研究は10年間にわたり実施された以前の研究の知見を基盤としている。"},
  {id:43,w:"significant",m:"重要な；著しい；意義深い",et:"由来: ラテン語 significans, present participle of significare ← signum (“sign”) + ficare (“do, make”), variant of facere",e:"The intervention led to a statistically significant reduction in hospital admission rates.",ej:"その介入により、入院率が統計的に有意に減少した。"},
  {id:44,w:"income",m:"収入；所得",et:"由来: 中英語 income, perhaps continuing (in altered form) 古英語 incyme (“an in-coming, entrance”), 構成: in- +‎ come. Cognate with Saterland Frisian Íenkúumen (“income”), West...",e:"Income inequality has widened considerably in many high-income economies in recent years.",ej:"高所得国の多くで、近年所得格差が大幅に拡大している。"},
  {id:45,w:"contract",m:"契約；縮小する",et:"由来: 中英語 ← 古フランス語 contract ← ラテン語 contractus (noun) ← contrahere (“to bring together, to bring about, to conclude a bargain”) +‎ -tus (suffix forming nouns ← verbs) / 由来: 中英語 ← 中期フランス語 contracter ← ラテン語 contractum, past participle of contrahere (“to bring together, to bring about, to conclude a bargain”) ← con- (“with, together”) +...",e:"Workers signed a legally binding contract guaranteeing fair wages and safe conditions.",ej:"労働者たちは公正な賃金と安全な労働条件を保証する法的拘束力のある契約を締結した。"},
  {id:46,w:"consider",m:"考慮する；みなす",et:"由来: 中英語 consideren ← 中期フランス語 considerer ← ラテン語 considerare",e:"Policymakers must consider the full social and environmental costs of industrial expansion.",ej:"政策立案者は産業拡大に伴う社会的・環境的コストを十分に考慮しなければならない。"},
  {id:47,w:"attempt",m:"試みる；試み",et:"Late 14th century, as 中英語 attempten ← 古フランス語 atempter ← ラテン語 attemptō (“to try, solicit”) ← ad- (“to”) + temptō; see tempt. The noun is ← the 1530s, the sense \"an assa...",e:"The first attempt to introduce the legislation was rejected by a majority in parliament.",ej:"その法案を導入する最初の試みは、議会の過半数によって否決された。"},
  {id:48,w:"specific",m:"特定の；具体的な",et:"由来: 古フランス語 specifique ← 後期ラテン語 specificus (“specific, particular”) ← ラテン語 speciēs (“kind”) + -ific",e:"The guidelines provide specific emissions targets for each major industrial sector.",ej:"ガイドラインは主要な産業セクターごとの具体的な排出目標を定めている。"},
  {id:49,w:"claim",m:"主張する；要求する",et:"由来: 中英語 claimen, borrowed ← 古フランス語 clamer (“to call, name, send for”) ← ラテン語 clāmō, clāmāre (“to call, cry out”) ← Proto-Italic *klāmāō ← 印欧祖語 *kelh₁- (“to shout”), wh...",e:"Researchers claim the new treatment reduces recovery time by approximately 40 percent.",ej:"研究者たちは新しい治療法により回復時間が約40%短縮すると主張している。"},
  {id:50,w:"leading",m:"主要な；先頭の",et:"由来: 中英語 ledinge, ledynge, ledand, ledande, ledende ← 古英語 lǣdende ← 西ゲルマン祖語 *laidijandī ← ゲルマン祖語 *laidijandz, present participle of ゲルマン祖語 *laidijaną (“to lead”), 構成: l... / 由来: 中英語 leding, ledyng, ledinge, ledunge, 構成: lead +‎ -ing. Cognate with オランダ語 leiding (“conduit, leading, guidance, leadership”), ドイツ語 Leitung (“line, conduit, cable”)",e:"She is one of the leading authorities on the intersection of poverty and public health.",ej:"彼女は貧困と公衆衛生の交点に関する第一人者の研究者の一人だ。"},
  {id:51,w:"potential",m:"潜在的な；可能性",et:"由来: 後期ラテン語 potentialis ← ラテン語 potentia (“power”) ← potens (“powerful”). By surface analysis, potent +‎ -ial",e:"Offshore wind farms have enormous potential to supply clean energy at a national scale.",ej:"沖合の風力発電所は、国家規模でクリーンエネルギーを供給する大きな可能性を持っている。"},
  {id:52,w:"demand",m:"需要；要求する",et:"由来: late 中英語 demaunden ← 古フランス語 demander ← ラテン語 dēmandō, dēmandāre",e:"Global demand for electric vehicles is projected to triple within the next ten years.",ej:"電気自動車の世界需要は今後10年以内に3倍になると予測されている。"},
  {id:53,w:"unless",m:"〜でない限り",et:"由来: 中英語 unlesse, earlier on lesse (modern on + less) ← (not) on lesse (than) (“(not) on a less compelling condition (than)”). The quality of negation in the word and t...",e:"Unless carbon emissions are dramatically reduced, average temperatures will continue to rise.",ej:"炭素排出量が大幅に削減されない限り、平均気温は上昇し続けるだろう。"},
  {id:54,w:"access",m:"アクセス；利用する",et:"由来: 中英語 accesse, acces, borrowed ← 中期フランス語 acces (“attack, onslaught”) or ← its source ラテン語 accessus, perfect passive participle of accēdō (“approach; accede”) ← ad (“... / First attested in 1962",e:"Equal access to quality education is regarded as a fundamental human right worldwide.",ej:"質の高い教育への平等なアクセスは、基本的人権として広く認識されている。"},
  {id:55,w:"independent",m:"独立した",et:"由来: フランス語 indépendant, 構成: in- +‎ dependent",e:"An independent audit was commissioned to verify the accuracy of the financial reports.",ej:"財務報告の正確性を検証するため、独立した監査が委託された。"},
  {id:56,w:"benefit",m:"利益；恩恵",et:"由来: Late 中英語 benefytt, benefett, alteration (due to ラテン語 bene-) of benfet, bienfet, bienfait (“good or noble deed”) ← アングロノルマン語 benfet (“well-done”), 中期フランス語 bienfait...",e:"The long-term health benefits of preventive medicine far outweigh the initial investment.",ej:"予防医療の長期的な健康上の利点は、当初の投資費用を大きく上回る。"},
  {id:57,w:"employment",m:"雇用；就業",et:"由来: employ (itself ← 中期フランス語 employer ← 中期フランス語 empleier ← ラテン語 implicō (“enfold, involve, be connected with”), itself ← in- + plicō (“fold”)) +‎ -ment",e:"The shift towards automation poses a serious threat to employment in manufacturing.",ej:"自動化への移行は製造業における雇用に深刻な脅威をもたらしている。"},
  {id:58,w:"sales",m:"販売；売上",et:"",e:"Sales of electric vehicles have surged globally as battery production costs continue to fall.",ej:"バッテリー生産コストが下がり続けるにつれ、電気自動車の世界販売台数が急増した。"},
  {id:61,w:"application",m:"申請；応用；アプリ",et:"由来: Late 中英語 applicacioun, borrowed ← 古フランス語 aplicacion (フランス語 application) ← ラテン語 applicātiōnem, accusative singular of applicātiō (“attachment; application, inclinat...",e:"The application of artificial intelligence to medical diagnosis has expanded rapidly.",ej:"医療診断における人工知能の応用は急速に拡大している。"},
  {id:62,w:"suppose",m:"〜と思う；仮定する",et:"由来: 中英語 supposen, borrowed ← 古フランス語 supposer, 構成: prefix sub- (“under”) + poser (“to place”); corresponding in meaning to ラテン語 supponere (“to put under, to substitute...",e:"It would be wrong to suppose that higher income automatically translates to greater happiness.",ej:"高い収入が自動的に幸福につながると思い込むのは間違いだろう。"},
  {id:63,w:"immediately",m:"すぐに；直ちに",et:"由来: 中英語 immediatly, 構成: immediate +‎ -ly",e:"Governments must act immediately to address the growing threat of climate change.",ej:"政府は気候変動の増大する脅威に対処するため、即座に行動しなければならない。"},
  {id:64,w:"opportunity",m:"機会；チャンス",et:"由来: opportune +‎ -ity ← 中期フランス語 opportunité ← ラテン語 opportūnitās",e:"Higher education provides individuals with the opportunity to improve their career prospects.",ej:"高等教育は個人にキャリアの見通しを向上させる機会を与える。"},
  {id:65,w:"film",m:"映画；撮影する",et:"由来: 中英語 filme ← 古英語 filmen (“film, membrane, thin skin, foreskin”) ← 西ゲルマン祖語 *filmīn- ← ゲルマン祖語 *filmīn- (“thin skin, membrane”)) ← 印欧祖語 *pél-mo- (“membrane”) ← *pel- (...",e:"The documentary film raised global awareness of the devastating effects of ocean pollution.",ej:"そのドキュメンタリー映画は海洋汚染の壊滅的な影響への世界的な認識を高めた。"},
  {id:66,w:"trust",m:"信頼；信託；信じる",et:"由来: 中英語 trust, trost (“trust, protection”). Long considered a borrowing ← 古ノルド語 traust (“confidence, help, protection”) ← ゲルマン祖語 *traustą, but the root vocalism is inc...",e:"Public trust in government institutions has declined significantly over the past two decades.",ej:"政府機関への国民の信頼はこの20年間で大幅に低下した。"},
  {id:67,w:"effective",m:"効果的な；有効な",et:"由来: フランス語 effectif ← ラテン語 effectīvus (“productive; effective”) ← efficiō (“to make; to bring about”), 構成: effect +‎ -ive",e:"Vaccination has proven to be the most effective means of preventing infectious disease.",ej:"ワクチン接種は感染症を防ぐ最も効果的な手段であることが証明されている。"},
  {id:68,w:"region",m:"地域；地方",et:"由来: 中英語 regioun ← アングロノルマン語 regiun ← ラテン語 regiō ← regō",e:"The northern region of the country receives less than 200 millimetres of rainfall annually.",ej:"その国の北部地域は年間200ミリ未満の降水量しか受け取っていない。"},
  {id:69,w:"degree",m:"程度；学位；度",et:"由来: 中英語 degre, borrowed ← 古フランス語 degré (フランス語: degré), itself ← ラテン語 gradus, with the prefix de-",e:"The degree to which climate change affects agriculture varies considerably by region.",ej:"気候変動が農業に与える影響の程度は地域によって大幅に異なる。"},
  {id:70,w:"traditional",m:"伝統的な",et:"由来: tradition + -al",e:"Traditional fishing communities are among the most vulnerable to the effects of overfishing.",ej:"伝統的な漁業コミュニティは乱獲の影響を最も受けやすい集団の一つだ。"},
  {id:71,w:"election",m:"選挙",et:"由来: 中英語 eleccioun, eleccion ← アングロノルマン語 eleccioun ← ラテン語 ēlectiōn-, stem of ēlectiō (“choice, selection”) ← ēligō (“to pluck out, to choose”). 構成: elect +‎ -ion. Displ...",e:"Voter turnout in the election reached its highest level in thirty years.",ej:"その選挙での投票率は30年間で最高水準に達した。"},
  {id:72,w:"parliament",m:"議会；国会",et:"由来: 中英語 parlement ← アングロノルマン語 parliament, parlement, parliment and 古フランス語 parlement (“discussion, meeting, negotiation; assembly, council”) ← parler (“to speak”) + -me...",e:"Parliament passed new legislation requiring a 40 percent reduction in carbon emissions by 2030.",ej:"議会は2030年までに炭素排出量を40%削減することを義務付ける新法を可決した。"},
  {id:73,w:"review",m:"評価；見直す；レビュー",et:"由来: 中英語 revewe, reveue ← 古フランス語 reveüe, revue (Modern フランス語: revue), feminine form of reveü, past participle of reveoir (フランス語: revoir) ← ラテン語 revideō ← re- +videō (“s...",e:"An independent review of the evidence concluded that the policy had been largely ineffective.",ej:"証拠の独立した審査により、政策はほぼ効果がなかったと結論づけられた。"},
  {id:74,w:"species",m:"種（生物）",et:"由来: ラテン語 speciēs (“appearance; quality”) ← speciō (“see”) + -iēs suffix signifying abstract noun",e:"Over one million species are currently at risk of extinction due to habitat destruction.",ej:"100万種以上の生物が現在、生息地の破壊により絶滅の危機に瀕している。"},
  {id:75,w:"supply",m:"供給；提供する",et:"由来: 中英語 supplien, borrowed ← 古フランス語 soupleer, souploier ← ラテン語 suppleo (“to fill up, make full, complete, supply”). The 中英語 spelling was modified to conform to ラテン語 et... / 由来: supple +‎ -ly",e:"The global supply of fresh water is under increasing pressure from population growth.",ej:"淡水の世界供給は人口増加からますます大きな圧力を受けている。"},
  {id:78,w:"physical",m:"物理的な；身体的な",et:"借用: 後期ラテン語 physicālis ← ラテン語 physica (“study of nature”) ← 古代ギリシア語 φυσική (phusikḗ), feminine singular of φυσικός (phusikós, “natural; physical”) ← φύσις (phúsis, “ori...",e:"Regular physical activity is strongly associated with reduced rates of chronic illness.",ej:"定期的な身体活動は慢性疾患の低い発生率と強く関連している。"},
  {id:79,w:"complex",m:"複雑な",et:"由来: フランス語 complexe ← ラテン語 complexus, past participle of complector (“to entwine, encircle, compass, infold”) ← com- (“together”) and plectō (“to weave, braid”). May be...",e:"The relationship between poverty and educational attainment is highly complex.",ej:"貧困と学業成績の間の関係は非常に複雑だ。"},
  {id:80,w:"responsibility",m:"責任",et:"由来: responsible +‎ -ity. Although the components are of フランス語 origin, the compound appears to have been formed in English. Later-attested フランス語 responsabilité is model...",e:"It is the responsibility of wealthier nations to take the lead on reducing carbon emissions.",ej:"炭素排出削減を主導する責任は裕福な国々にある。"},
  {id:81,w:"opposition",m:"反対；野党",et:"由来: 中英語 opposicioun ← 古フランス語 oposicion (whence フランス語 opposition) ← 後期ラテン語 oppositiō, translating 古代ギリシア語 ἀντίθεσις (antíthesis) ← the past participle stem of classical...",e:"The proposed reforms faced fierce opposition from industry groups and trade unions.",ej:"提案された改革は産業界と労働組合から激しい反対に直面した。"},
  {id:82,w:"division",m:"分割；部門",et:"由来: 中英語 divisioun ← 古フランス語 division ← ラテン語 dīvīsiō, dīvīsiōnem, noun of process form ← perfect passive participle dīvīsus (“divided”) ← dīvidō (“divide”)",e:"The growing division between rich and poor poses a serious threat to social cohesion.",ej:"富裕層と貧困層の間の拡大する分断は社会的結束に深刻な脅威をもたらしている。"},
  {id:83,w:"surface",m:"表面；水面",et:"借用: 中期フランス語 surface. By surface analysis, sur- +‎ face",e:"Rising ocean temperatures are altering the surface conditions of marine ecosystems.",ej:"海洋温度の上昇は海洋生態系の表層条件を変化させている。"},
  {id:84,w:"equipment",m:"設備；機器",et:"由来: equip +‎ -ment, or ← フランス語 équipement",e:"Access to modern medical equipment is severely limited in many low-income countries.",ej:"最新の医療設備へのアクセスは多くの低所得国で著しく制限されている。"},
  {id:85,w:"suggest",m:"提案する；示唆する",et:"Coined based on ラテン語 suggestus, perfect passive participle of suggerō (“bring up, bring under, lay beneath, furnish, supply, excite, advise, suggest”, verb) ← sub (“fr...",e:"The data strongly suggest that early childhood intervention improves long-term educational outcomes.",ej:"データは、幼少期の早期介入が長期的な教育的成果を大幅に改善することを強く示唆している。"},
  {id:86,w:"exchange",m:"交換する；取引所",et:"由来: 中英語 eschaunge, borrowed ← アングロノルマン語 eschaunge ← 古フランス語 eschange (whence modern フランス語 échange) ← the verb eschanger ← 俗ラテン語 *excambiāre (from ラテン語 ex with 後期ラテン語 ca... / 由来: 中英語 eschaungen ← アングロノルマン語 eschaungier, 古フランス語 eschanger ← the 古フランス語 verb eschangier, eschanger (whence modern フランス語 échanger) ← 俗ラテン語 *excambiāre (from ラテン語 ex w...",e:"Cultural exchange programmes play an important role in fostering international understanding.",ej:"文化交流プログラムは国際的な理解を育む上で重要な役割を果たしている。"},
  {id:87,w:"otherwise",m:"さもなければ；別の方法で",et:"由来: 中英語 otherwise, othre wise ← 古英語 on ōþre wīsan (literally “in (on) other/different manner”); 構成: other +‎ -wise",e:"Investment in education must be sustained; otherwise, long-term economic growth will stall.",ej:"教育への投資は維持されなければならない。そうでなければ長期的な経済成長は停滞するだろう。"},
  {id:88,w:"essential",m:"不可欠な；本質的な",et:"由来: 後期ラテン語 essentiālis ← ラテン語 essentia (“being, essence”)",e:"Access to clean water is essential for maintaining basic standards of public health.",ej:"清潔な水へのアクセスは公衆衛生の基本的水準を維持するために不可欠だ。"},
  {id:89,w:"function",m:"機能；役割",et:"由来: 中期フランス語 function ← 古フランス語 fonction ← ラテン語 functiō (“performance, execution”) ← functus, perfect participle of fungor (“to perform, execute, discharge”) ← 印欧祖語 *bʰe...",e:"The primary function of the regulatory body is to ensure consumer protection.",ej:"免疫システムの主な機能は感染源から体を守ることだ。"},
  {id:90,w:"slightly",m:"わずかに；少し",et:"由来: slight + -ly",e:"Average global temperatures have risen by slightly more than one degree Celsius since 1850.",ej:"世界の平均気温は1850年以降、1度強上昇している。"},
  {id:91,w:"aid",m:"援助；助ける",et:"由来: 中英語 aide, eide, ayde ← 古フランス語 eide, aide ← aidier ← ラテン語 adiūtō, adiūtāre (“to assist, help”). Cognates include スペイン語 ayuda, Portuguese ajuda and イタリア語 aiuto / 由来: 中英語 aiden ← 古フランス語 eider, aider, aidier ← ラテン語 adiuto, frequentative of adiuvō (“assist”, verb)",e:"International aid must be carefully targeted to address the root causes of poverty.",ej:"国際援助は貧困の根本原因に対処するため、慎重に対象を絞る必要がある。"},
  {id:92,w:"transport",m:"輸送；交通機関",et:"由来: 中英語 transporten, a borrowing ← 古フランス語 transporter (“carry or convey across”) ← ラテン語 trānsportō ← trans (“across”) + porto (“to carry”). By surface analysis, trans-...",e:"Investment in public transport infrastructure is key to reducing urban carbon emissions.",ej:"公共交通インフラへの投資は都市の炭素排出量削減の鍵となる。"},
  {id:94,w:"civil",m:"市民の；礼儀正しい；民事の",et:"由来: 中英語 cyvyl, civil, borrowed ← 古フランス語 civil ← ラテン語 cīvīlis (“relating to a citizen”) ← cīvis (“citizen”). Cognate with 古英語 hīwen (“household”), hīrǣden (“family”). M...",e:"Civil society organisations play a crucial role in holding governments to account.",ej:"市民社会組織は政府に責任を持たせる上で重要な役割を果たしている。"},
  {id:95,w:"hardly",m:"ほとんど〜ない；やっと",et:"由来: 中英語 hardely, hardliche ← 古英語 heardlīċe (“boldly; hardily; without ease; in a way that causes pain; not easily; only by degrees”), 構成: hard +‎ -ly",e:"There is hardly any evidence to suggest that current policies are sufficient.",ej:"現在の政策が十分であることを示す証拠はほとんどない。"},
  {id:96,w:"obvious",m:"明らかな；明白な",et:"16th century ← ラテン語 obvius (“being in the way so as to meet, meeting, easy to access, at hand, ready, obvious”) +‎ -ous ← ob- (“before”) + via (“way”)",e:"It is obvious from the data that urgent action is required to address global inequality.",ej:"データから、世界的な不平等に対処するため緊急の行動が必要であることは明らかだ。"},
  {id:97,w:"organisation",m:"組織；団体",et:"由来: 中期フランス語 organisation, 構成: organise +‎ -ation",e:"The international organisation coordinates efforts to protect endangered marine ecosystems.",ej:"その国際機関は絶滅の危機にある海洋生態系を守る取り組みを調整している。"},
  {id:98,w:"argument",m:"議論；主張",et:"由来: 中英語 argument ← アングロノルマン語 and 古フランス語 arguement ← ラテン語 argumentum. The English word is analysable as argue +‎ -ment / The obsolete senses are derived ← 中英語 argumenten (“to argue, discuss; to consider, reflect”) ← 古フランス語 argumenter (“to argue”) ← ラテン語 argūmentārī (“to adduce arguments...",e:"The central argument of the report is that economic growth alone cannot eliminate poverty.",ej:"報告書の中心的な主張は、経済成長だけでは貧困を解消できないということだ。"},
  {id:99,w:"patient",m:"患者；忍耐強い",et:"由来: 中英語 pacient ← 中期フランス語 patient ← 古フランス語 pacient ← ラテン語 patiens, present participle of patior (“to suffer, endure”) ← 印欧祖語 *peh₁- (“to hate, hurt”)",e:"Doctors emphasise the importance of patient education in managing chronic conditions effectively.",ej:"医師たちは慢性疾患を効果的に管理する上で患者教育の重要性を強調している。"},
  {id:100,w:"principle",m:"原則；原理",et:"由来: 中英語 principle ← 古フランス語 principe ← ラテン語 prīncipium (“beginning, foundation”) ← prīnceps (“first”). By surface analysis, prīmus (“first”) +‎ -ceps (“catcher”); the f...",e:"The principle of sustainable development requires balancing economic growth with ecological protection.",ej:"持続可能な発展の原則は、経済成長と生態系保護のバランスを取ることを求める。"},
  {id:101,w:"stock",m:"在庫；株式；蓄える",et:"由来: 中英語 stok ← 古英語 stocc ← 西ゲルマン祖語 *stokk ← ゲルマン祖語 *stukkaz (“tree-trunk”) / 由来: イタリア語 stoccata",e:"Global fish stocks have been severely depleted by decades of intensive commercial fishing.",ej:"世界の魚資源は数十年にわたる集中的な商業漁業により深刻に枯渇している。"},
  {id:102,w:"district",m:"地区；地域",et:"由来: フランス語 district ← 中世ラテン語 districtus (“a district within which the lord may distrain, also jurisdiction”) ← ラテン語 districtus, past participle of distringere (“to draw...",e:"The district was identified as a priority area for targeted investment in public health.",ej:"その地区は公衆衛生への的を絞った投資の優先地域として特定された。"},
  {id:103,w:"executive",m:"経営幹部；行政の",et:"由来: 中期フランス語 executif ← ラテン語 executivus ← ラテン語 exsequi ← ex- ‘out’ + sequi ‘follow’",e:"The executive team approved a new strategy aimed at reducing the company's carbon footprint.",ej:"経営幹部チームは企業の炭素フットプリントを削減することを目指した新戦略を承認した。"},
  {id:104,w:"neither",m:"どちらも〜ない",et:"Alteration (after either) of nauther ← 中英語 neiþer ← 古英語 nāwþer, contraction of nāhwæþer, corresponding to no + whether. By surface analysis, not +‎ either",e:"Greater public awareness of neither is considered essential for driving meaningful behavioural change.",ej:"意味のある行動変容を促進するために公衆の認識向上が不可欠とされている。"},
  {id:105,w:"duty",m:"義務；職務",et:"由来: 中英語 duete ← 中英語 dewe + 中英語 -te. 構成: due + -ty",e:"It is the duty of every nation to uphold international agreements on climate change.",ej:"すべての国家が気候変動に関する国際協定を遵守することが義務だ。"},
  {id:106,w:"presence",m:"存在；出席",et:"Through 古フランス語 presence ← ラテン語 praesentia (“a being present”) ← praesentem. Displaced native 古英語 andweardnes",e:"The increasing presence of microplastics in ocean water is a cause for serious concern.",ej:"海洋水中のマイクロプラスチックの増大する存在は深刻な懸念の原因だ。"},
  {id:107,w:"avoid",m:"避ける；回避する",et:"由来: 中英語 avoiden ← アングロノルマン語 avoider, 古フランス語 esvuidier (“to empty out”) ← es- + vuidier ← 俗ラテン語 *vocitāre < 俗ラテン語 *vocitum, ultimately related to ラテン語 vacuus. Displaced...",e:"Governments should take steps to avoid policies that disproportionately harm lower-income groups.",ej:"政府は低所得層に不均衡な影響を与える政策を避けるための手順を講じるべきだ。"},
  {id:108,w:"relatively",m:"比較的",et:"由来: relative + -ly",e:"The cost of solar energy has fallen relatively rapidly over the past decade.",ej:"太陽エネルギーのコストはここ10年で比較的急速に低下した。"},
  {id:109,w:"failure",m:"失敗；欠如",et:"由来: アングロノルマン語 failer ← 古フランス語 faillir (“to fail”). 構成: fail +‎ -ure",e:"The failure to meet agreed emissions targets has undermined international climate negotiations.",ej:"合意された排出目標を達成できなかったことは国際的な気候交渉を弱体化させた。"},
  {id:111,w:"due",m:"期限の；適切な；到着予定の",et:"由来: 中英語 dewe, dew, due ← 古フランス語 deü (“due”), past participle of devoir (“to owe”) ← ラテン語 dēbēre (“to owe”) ← dē- (“from”) +‎ habeō (“to have”)",e:"The relationship between due and long-term economic productivity has been extensively documented.",ej:"長期的な経済生産性との関係は幅広く記録されている。"},
  {id:112,w:"practical",m:"実用的な；実践的な",et:"由来: 中英語 practical, practicale, praktycall ← 中世ラテン語 practicālis",e:"Researchers are seeking practical solutions to the challenge of sustainable urban development.",ej:"研究者たちは持続可能な都市開発という課題への実践的な解決策を求めている。"},
  {id:113,w:"latter",m:"後者の；後半の",et:"由来: 中英語 latter, lattere, lattre ← 古英語 lætra, comparative form of læt (“late”). 構成: late +‎ -er, thus a",e:"Of the two approaches examined, the latter proved to be significantly more cost-effective.",ej:"検討された2つのアプローチのうち、後者の方が大幅にコスト効率が高いことが証明された。"},
  {id:114,w:"huge",m:"巨大な；莫大な",et:"由来: 中英語 huge ← 古フランス語 ahuge (“high, lofty, great, large, huge”), of unknown origin",e:"The discovery represents a huge step forward in our understanding of renewable energy storage.",ej:"その発見は再生可能エネルギー貯蔵の理解における大きな前進を表している。"},
  {id:115,w:"apparently",m:"どうやら；見たところ",et:"由来: apparent + -ly",e:"The new policy, apparently designed to reduce inequality, has had the opposite effect.",ej:"不平等を減らすために設計されたと思われる新政策は、逆の効果をもたらした。"},
  {id:116,w:"grant",m:"助成金；与える",et:"由来: 中英語 granten, graunten, grantien, grauntien ← アングロノルマン語 granter, graunter ← 古フランス語 granter, graunter, graanter, greanter (“to promise, assure, guarantee, confirm, r...",e:"The research team received a substantial grant to investigate the effects of air pollution.",ej:"研究チームは大気汚染の影響を調査するための多額の助成金を受け取った。"},
  {id:117,w:"applied",m:"応用の；実用的な",et:"",e:"Applied research in materials science has led to significant improvements in battery technology.",ej:"材料科学の応用研究はバッテリー技術の大幅な改善をもたらした。"},
  {id:118,w:"finance",m:"財政；資金調達する",et:"由来: 中英語 finaunce ← アングロノルマン語, 中期フランス語 finance ← finer (“to pay ransom”) (whence also English fine (“to pay a penalty”)) ← fin (“end”) ← ラテン語 fīnis. Original English se...",e:"Access to affordable finance is essential for small businesses to invest in clean technology.",ej:"クリーン技術に投資するため、中小企業にとって手頃な資金調達へのアクセスが不可欠だ。"},
  {id:119,w:"merely",m:"単に；ただ〜だけ",et:"由来: 中英語 mereli, 構成: mere +‎ -ly",e:"Economic growth alone is merely one component of sustainable human development.",ej:"経済成長だけでは持続可能な人間開発の一要素にすぎない。"},
  {id:120,w:"setting",m:"設定；環境；背景",et:"",e:"The urban setting presents unique challenges for the delivery of effective public health services.",ej:"都市の環境は効果的な公衆衛生サービスの提供に独特の課題をもたらしている。"},
  {id:121,w:"quarter",m:"四分の一；四半期",et:"由来: 中英語 quarter ← アングロノルマン語 quarter ← ラテン語 quartarius ← quartus / 借用: フランス語 cartayer",e:"In the final quarter of the year, carbon emissions fell to a record low.",ej:"その年の最終四半期に、炭素排出量は記録的な低水準まで低下した。"},
  {id:122,w:"politics",m:"政治；政治学",et:"由来: the adjective politic, by analogy with Aristotle’s τά πολῑτῐκᾱ́ (tá polītĭkā́, “affairs of state”)",e:"Environmental politics has moved to the centre of policy debates in many countries.",ej:"環境政治は多くの国の政策議論の中心に移行している。"},
  {id:123,w:"justice",m:"正義；司法",et:"由来: 中英語 justice ← 古フランス語 justise, justice (Modern フランス語 justice) ← ラテン語 iūstitia (“righteousness, equity”) ← iūstus (“just”) ← iūs (“right”) ← Proto-Italic *jowos, per...",e:"Climate justice requires that those most responsible for emissions bear the greatest costs.",ej:"気候正義は排出量に最も責任のある者が最大のコストを負担することを求める。"},
  {id:124,w:"credit",m:"信用；単位；功績",et:"借用: 中期フランス語 crédit (“belief, trust”) ← ラテン語 crēditum (“a loan, credit”), neuter of crēditus, past participle of crēdere (“to believe”). The verb is ← the noun",e:"Full credit must be given to the communities that pioneered sustainable development practices.",ej:"持続可能な開発の実践を先導したコミュニティに十分な評価が与えられなければならない。"},
  {id:125,w:"edge",m:"端；優位；刃",et:"由来: 中英語 egge ← 古英語 eċġ ← 西ゲルマン祖語 *aggju ← ゲルマン祖語 *agjō ← 印欧祖語 *h₂eḱ- (“sharp”)",e:"Without adequate edge, sustainable development goals are unlikely to be met on time.",ej:"適切な支援がなければ、持続可能な開発目標は時間内に達成されないだろう。"},
  {id:126,w:"advantage",m:"利点；優位性",et:"由来: 中英語 avantage, avauntage ← 古フランス語 avantage ← avant (“before”) ← 後期ラテン語 ab ante. The spelling with d originates in a latinizing hypercorrection, the a- being falsely...",e:"A key advantage of renewable energy is its dramatically lower long-term operating cost.",ej:"再生可能エネルギーの主な利点は、長期的な運用コストが大幅に低いことだ。"},
  {id:129,w:"length",m:"長さ；期間",et:"由来: 中英語 lengthe ← 古英語 lengþ, lengþu ← 西ゲルマン祖語 *langiþu ← ゲルマン祖語 *langiþō, 構成: long +‎ -th (abstract nominal suffix). Cognate with Scots lenth, lainth (“length”), Sater...",e:"The length of time required for ecosystems to recover from damage can span several centuries.",ej:"生態系が損傷から回復するのに必要な期間は数世紀に及ぶこともある。"},
  {id:130,w:"vote",m:"投票する；票",et:"由来: ラテン語 vōtum, a form of voveō (“to vow”) (cognate with 古代ギリシア語 εὔχομαι (eúkhomai, “to vow”)) ← 印欧祖語 *h₁wegʷʰ- (“to promise, to vow”)",e:"Citizens in many countries have voted in favour of stronger environmental protection measures.",ej:"多くの国の市民は、より強力な環境保護措置を支持する投票を行っている。"},
  {id:131,w:"possibly",m:"もしかすると；おそらく",et:"由来: possible + -ly",e:"The region could possibly experience its worst drought in over a century.",ej:"その地域は1世紀以上で最悪の干ばつを経験する可能性がある。"},
  {id:132,w:"nevertheless",m:"それにもかかわらず",et:"由来: 中英語 nevertheles, never-þe-les, nevere-þe-lesse. By surface analysis, never (“not at all”) +‎ the +‎ less;",e:"The evidence was inconclusive; nevertheless, the findings merit further investigation.",ej:"証拠は不確定だったが、それにもかかわらず調査結果はさらなる調査に値する。"},
  {id:133,w:"insurance",m:"保険",et:"由来: the older form ensurance, see also assurance. By surface analysis, insure +‎ -ance",e:"Crop insurance schemes can help protect vulnerable farming communities from climate-related losses.",ej:"農作物保険制度は、気候関連の損失から脆弱な農業コミュニティを守るのに役立つ。"},
  {id:134,w:"strength",m:"強さ；体力",et:"由来: 中英語 strengthe ← 古英語 strengþu (“strength”) ← 西ゲルマン祖語 *strangiþu (“strongness; strength”), 構成: strong +‎ -th (abstract nominal suffix). Cognate with オランダ語 strengte (...",e:"The strength of the evidence linking air pollution to cardiovascular disease is now overwhelming.",ej:"大気汚染と心臓血管疾患を結びつける証拠の強さは今や圧倒的だ。"},
  {id:135,w:"crime",m:"犯罪",et:"由来: 中英語 cryme, crime ← 古フランス語 crime, crimne ← ラテン語 crīmen. Displaced native 古英語 firen",e:"Environmental crime, including illegal logging and wildlife trafficking, is a growing global concern.",ej:"違法伐採や野生動物の密売を含む環境犯罪は、増大する世界的な懸念となっている。"},
  {id:136,w:"transfer",m:"移す；転送する",et:"由来: ラテン語 trānsferō (“to bear across”). Distant See also collate and confer, delate and defer, as well as prelate and prefer among others",e:"Technology transfer from developed to developing nations is essential for green energy adoption.",ej:"先進国から途上国への技術移転はグリーンエネルギーの普及に不可欠だ。"},
  {id:137,w:"measure",m:"測定する；対策；程度",et:"由来: 中英語 mesure ← 古フランス語 mesure ← ラテン語 mēnsūra (“a measure”), mētior (“to measure”, supine stem in mēns-) + -tūra. Largely displaced native 古英語 metan (\"to measure\" when...",e:"A comprehensive range of measures was introduced to improve air quality in heavily polluted cities.",ej:"ひどく汚染された都市の大気の質を改善するため、包括的な対策が導入された。"},
  {id:138,w:"confidence",m:"自信；信頼",et:"由来: 中英語 confidence ← ラテン語 cōnfīdentia (possibly via 古フランス語 confidence) ← cōnfīdō (“believe, confide in”) ← con- (“with”) + fīdō (“trust”)",e:"Consumer confidence fell sharply following the announcement of weaker than expected growth figures.",ej:"予想を下回る成長率の発表後、消費者信頼感が急落した。"},
  {id:139,w:"address",m:"取り組む；演説する",et:"由来: 中英語 adressen (“to radise erect, adorn”) ← 古フランス語 adrecier (“to straighten, address”) (modern フランス語 adresser) ← Proto-Romance *addīrēctiāre ← ad- (“to; towards”) +...",e:"Governments must address the structural causes of poverty rather than merely treating its symptoms.",ej:"政府は貧困の症状を治療するだけでなく、構造的な原因に取り組まなければならない。"},
  {id:140,w:"require",m:"必要とする；要求する",et:"由来: 古フランス語 requerre (フランス語: requérir) ← ラテン語 requīrō (“to require, seek, ask for”)",e:"Sustainable development requires a fundamental shift in how societies produce and consume energy.",ej:"持続可能な開発は、社会がエネルギーを生産・消費する方法の根本的な転換を必要とする。"},
  {id:142,w:"ordinary",m:"普通の；日常の",et:"由来: アングロノルマン語 ordenarie, ordenaire et al., 中期フランス語 ordinaire, and their source, 中世ラテン語 ordinarius, noun use of ラテン語 ōrdinārius (“regular, orderly”) ← ōrdō (“order”)",e:"Ordinary citizens are increasingly aware of the urgent need to reduce their carbon footprint.",ej:"一般市民は炭素フットプリントを削減する緊急の必要性についてますます意識するようになっている。"},
  {id:143,w:"previously",m:"以前に；前回は",et:"由来: previous + -ly",e:"The site had previously been used for industrial purposes and required extensive environmental remediation.",ej:"その場所はかつて工業用途に使用されており、広範な環境修復が必要だった。"},
  {id:146,w:"challenge",m:"挑戦；異議を唱える",et:"由来: 中英語 chalenge, variant with palatalization of 中英語 kalange (“an accusation, claim”) ← 古フランス語 chalenge, chalonge, palatalized Central フランス語 variants of Old Northern フ...",e:"Ensuring global food security in the face of climate change is one of humanity's greatest challenges.",ej:"気候変動に直面して世界の食料安全保障を確保することは、人類最大の課題の一つだ。"},
  {id:147,w:"achieve",m:"達成する；成し遂げる",et:"由来: 中英語 achieven, acheven ← アングロノルマン語 achever, 古フランス語 achever, achiever et al., apparently ← 後期ラテン語 *accapāre ← ad (“to”) + caput (“head”) + -ō (verbal suffix), or alt...",e:"Nations must work collectively to achieve the ambitious emissions targets set out in the Paris Agreement.",ej:"各国は、パリ協定に定められた野心的な排出目標を達成するため共同で取り組まなければならない。"},
  {id:148,w:"extremely",m:"非常に；極めて",et:"由来: extreme + -ly",e:"The economic consequences of unmitigated climate change are projected to be extremely severe.",ej:"緩和されない気候変動の経済的影響は極めて深刻になると予測されている。"},
  {id:149,w:"prevent",m:"防ぐ；妨げる",et:"由来: 中英語 preventen (“anticipate”) ← ラテン語 praeventus, perfect passive participle of praeveniō (“to anticipate”) ← prae (“before”) + veniō (“to come”)",e:"Vaccination remains the most effective and widely proven strategy for preventing infectious disease.",ej:"ワクチン接種は感染症を防ぐ最も効果的で広く実証された戦略であり続けている。"},
  {id:150,w:"article",m:"記事；条項；冠詞",et:"由来: 中英語 article ← 古フランス語 article ← ラテン語 articulus (“a joint, limb, member, part, division, the article in grammar, a point of time”) ← ラテン語 artus ← 印欧祖語 *h₂értus (“tha...",e:"The journal article presents compelling evidence for a direct link between diet and disease.",ej:"その学術論文は食事と認知機能の間の直接的な関連性について説得力のある証拠を示している。"},
  {id:151,w:"football",m:"フットボール；サッカー",et:"由来: 中英語 fotbal, footbal, 構成: foot +‎ ball, because the ball was primarily manipulated with the feet in early versions of the game (though some modern varieties involve...",e:"Improving football has become a central objective of international development organisations.",ej:"向上させることが国際開発機関の中心的な目標となっている。"},
  {id:152,w:"fairly",m:"かなり；公平に",et:"由来: 中英語 fayrly, fayrely, vayrliche, 構成: fair +‎ -ly",e:"The transition to renewable energy must be fairly and carefully managed to protect existing jobs.",ej:"再生可能エネルギーへの移行は既存の雇用を守るため注意深く管理されなければならない。"},
  {id:153,w:"increasingly",m:"ますます；次第に",et:"由来: 中英語 encreessingli, 構成: increasing +‎ -ly",e:"The researchers increasingly acknowledged the limitations arising from the restricted sample size.",ej:"研究者たちはサンプルサイズの制限から生じる限界を正直に認めた。"},
  {id:154,w:"initial",m:"最初の",et:"由来: 中期フランス語 initial or directly ← its ラテン語 etymon initiālis (“of the beginning, incipient, initial”) ← initium (“a going in, entrance, beginning”) ← inire (“to go in...",e:"Researchers concluded that the initial findings were initial and warranted immediate further investigation.",ej:"初期の知見は重要であり即座のさらなる調査が必要と結論づけられた。"},
  {id:155,w:"release",m:"を解放する；発表",et:"由来: 中英語 relesen, relessen ← 古フランス語 relaisser (variant of relascher) / 由来: re- + lease",e:"The study was designed to release the relationship between urbanisation and quality of life.",ej:"この研究は都市化と生活の質の関係を調べることを目的に設計された。"},
  {id:156,w:"existence",m:"存在；生存",et:"由来: 中英語 existence ← 古フランス語 existence ← 後期ラテン語 existentia (“existence”) ← existēns ← existō, exsistō (“I am, I exist”) ← ex (“out”) + sistere (“to set, place”) (related...",e:"Researchers emphasise the growing significance of existence in determining long-term health outcomes.",ej:"研究者たちは長期的な健康状態を決定する上でその重要性の高まりを強調している。"},
  {id:157,w:"latest",m:"最新の；最近の",et:"由来: 中英語 lateste ← 古英語 latost, latest, lætest, superlative of læt, whence English late",e:"Greater public awareness of latest is considered essential for driving meaningful behavioural change.",ej:"意味のある行動変容を促進するために公衆の認識向上が不可欠とされている。"},
  {id:158,w:"relief",m:"安堵；救済",et:"由来: 古フランス語 relief (“assistance”) ← 古フランス語 relever (“to relieve”) ← ラテン語 relevare (“to raise up, make light”). See also relieve / 由来: イタリア語 rilievo ← rilevare (“to raise”) ← ラテン語 relevō (“to raise”)",e:"A marked rise in relief has been documented across both developed and developing economies.",ej:"先進国と途上国の両方で、顕著な増加が記録されている。"},
  {id:159,w:"detailed",m:"詳細な；詳しい",et:"",e:"The evidence gathered in the study was detailed and remained consistent across all participant groups.",ej:"研究で収集された証拠は全ての参加グループにわたって一貫していた。"},
  {id:160,w:"fund",m:"資金；基金",et:"借用: ラテン語 fundus",e:"Greater public awareness of fund is considered essential for driving meaningful behavioural change.",ej:"意味のある行動変容を促進するために公衆の認識向上が不可欠とされている。"},
  {id:163,w:"distribution",m:"配布；分配",et:"由来: 古フランス語 ← ラテン語 distributio ← distribuere 'to distribute', itself ← dis- 'apart' + tribuere 'to' (from tribus). By surface analysis, distribute +‎ -ion",e:"The unequal distribution of resources between nations remains a major obstacle to development.",ej:"国家間の資源の不平等な分配は発展への主要な障害であり続けている。"},
  {id:164,w:"factor",m:"要因；要素",et:"由来: 中期フランス語 facteur ← ラテン語 factor (“a doer, maker, performer”) ← factus (“done or made”), perfect passive participle of faciō (“do, make”)",e:"Poverty has been identified as the single most significant factor contributing to poor health.",ej:"貧困は劣悪な健康状態に寄与する最も重要な単一要因として特定されている。"},
  {id:165,w:"feature",m:"特徴；特集する",et:"由来: 中英語 feture ← アングロノルマン語 feture ← 古フランス語 faiture ← ラテン語 factūra ← ラテン語 factus ← ラテン語 faciō (“do, make”), ultimately ← 印欧祖語 *dʰeh₁- (“to do, put, place, set”)",e:"A distinguishing feature of the policy is its emphasis on long-term sustainability.",ej:"その政策の際立った特徴は長期的持続可能性への重点だ。"},
  {id:166,w:"improve",m:"改善する；向上する",et:"由来: アングロノルマン語 emprouwer ← 古フランス語 en- + prou (“profit”) ← 俗ラテン語 prode (“advantageous, profitable”) / 由来: ラテン語 improbō (“disapprove, reject”)",e:"Investment in sustainable public transport can substantially improve air quality in congested cities.",ej:"持続可能な公共交通への投資は、混雑した都市の大気の質を大幅に改善できる。"},
  {id:167,w:"reasonable",m:"合理的な；適切な",et:"由来: 中英語 resonable ← 古フランス語 resnable ← Classical ラテン語 ratiōnābilis ← ratiō. By surface analysis, reason +‎ -able",e:"Researchers concluded that the initial findings were reasonable and warranted immediate further investigation.",ej:"初期の知見は重要であり即座のさらなる調査が必要と結論づけられた。"},
  {id:168,w:"display",m:"表示する；展示",et:"由来: 中英語 displayen ← アングロノルマン語 despleier and 古フランス語 despleier, desploiier ← 中世ラテン語 displicare (“to unfold, display”) ← ラテン語 dis- (“apart”) + plicāre (“to fold”)",e:"Scientists continue to display more sustainable and cost-effective methods of food production.",ej:"科学者たちはより持続可能で費用対効果の高い食料生産方法の開発を続けている。"},

  {id:2309,w:"refrain",m:"を控える；折り返し",et:"継承: 中英語 refreynen ← アングロノルマン語 refrener, 古フランス語 refrener ← ラテン語 refrēnāre ← re- +‎ frēnāre ← frēnum / 由来: フランス語 refrain ← the 古フランス語 verb refraindre (“to break off, repeat”) ← ラテン語 re- (“back, again”) + frangō (“break”); See refract and the verb refrain",e:"A marked rise in refrain has been documented across both developed and developing economies.",ej:"先進国と途上国の両方で、顕著な増加が記録されている。"},

  {id:2311,w:"hind",m:"後ろの；雌鹿",et:"由来: 中英語 hinde ← 古英語 hindan (“at the rear ← behind”), ゲルマン祖語 *hinder (“behind, beyond”) ← 印欧祖語 *ḱem-ta- (“down, below, with, far, along, against”) ← *ḱóm (“beside, near... / 由来: 中英語 hind, hinde, hynde ← 古英語 hind, 西ゲルマン祖語 *hindu ← ゲルマン祖語 *hindō, *hindiz ← a formation on 印欧祖語 *ḱem- (“hornless”). Cognate with オランダ語 hinde, ドイツ語 Hinde, Danish hind",e:"Without adequate hind, sustainable development goals are unlikely to be met on time.",ej:"適切な支援がなければ、持続可能な開発目標は時間内に達成されないだろう。"},

  {id:3190,w:"cub",m:"子熊；見習い",et:"由来: earlier cubbe. Origin unknown. According to Pokorny ← ゲルマン祖語 *kubb- ← 印欧祖語 *gup- (“round object, knoll”) ← *gew- (“to bend, curve, arch, vault”) / cub (plural cubs)",e:"Advances in cub have fundamentally transformed the way modern societies communicate and work.",ej:"現代社会が情報発信や仕事をする方法を根本的に変えた。"},

  {id:3194,w:"augment",m:"増やす；増強する",et:"由来: 中英語 augmenten ← 中期フランス語 augmenter ← 古フランス語 augmenter ← 後期ラテン語 augmentare (“to increase”) ← ラテン語 augmentum (“an increase, growth”) ← augere (“to increase”)",e:"A augment research methodology is essential for ensuring the reliability and validity of outcomes.",ej:"信頼性の高い結果を確保するために厳格な研究方法論が不可欠だ。"},

function todayStr(){return new Date().toLocaleDateString('ja-JP');}
function emptyStore(){return{progress:{},custom:[],dailyDate:'',dailyCount:0,marked:{}}}
function normalizeWord(w){
  return {...(w||{}),et:typeof w?.et==='string'?w.et:''};
}
function normalizeStore(s){
  return {
    ...emptyStore(),
    ...(s||{}),
    progress:s&&s.progress&&typeof s.progress==='object'?s.progress:{},
    marked:s&&s.marked&&typeof s.marked==='object'?s.marked:{},
    custom:s&&Array.isArray(s.custom)?s.custom.map(normalizeWord):[],
    dailyDate:s&&typeof s.dailyDate==='string'?s.dailyDate:'',
    dailyCount:s&&Number.isFinite(Number(s.dailyCount))?Number(s.dailyCount):0
  };
}
function mergeStores(local,cloud){
  const l=normalizeStore(local),c=normalizeStore(cloud);
  const customMap=new Map();
  [...(c.custom||[]),...(l.custom||[])].forEach(w=>{if(w&&w.id!=null)customMap.set(String(w.id),w)});
  const progress={};
  [...new Set([...Object.keys(c.progress||{}),...Object.keys(l.progress||{})])].forEach(id=>{progress[id]=!!c.progress[id]||!!l.progress[id]});
  const marked={};
  [...new Set([...Object.keys(c.marked||{}),...Object.keys(l.marked||{})])].forEach(id=>{marked[id]=!!c.marked[id]||!!l.marked[id]});
  const dailyFromCloud=c.cloudUpdatedAt&&(!l.cloudUpdatedAt||c.cloudUpdatedAt>l.cloudUpdatedAt);
  return {
    ...l,
    progress,
    marked,
    custom:[...customMap.values()],
    dailyDate:dailyFromCloud?c.dailyDate:l.dailyDate,
    dailyCount:dailyFromCloud?c.dailyCount:l.dailyCount,
    cloudUpdatedAt:c.cloudUpdatedAt||l.cloudUpdatedAt||''
  };
}
function expandImportedStore(data){
  if(data&&data.v===2){
    const progress={};
    const marked={};
    (Array.isArray(data.p)?data.p:[]).forEach(id=>{progress[id]=true});
    (Array.isArray(data.m)?data.m:[]).forEach(id=>{marked[id]=true});
    return normalizeStore({
      progress,
      marked,
      custom:Array.isArray(data.c)?data.c:[],
      dailyDate:typeof data.d==='string'?data.d:'',
      dailyCount:Number.isFinite(Number(data.n))?Number(data.n):0
    });
  }
  return normalizeStore(data);
}

function findMorphemes(word){
  const lower=(word||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!lower)return [];
  const prefix=PREFIXES.find(([raw])=>lower.startsWith(raw)&&lower.length>raw.length+2);
  const suffix=SUFFIXES.find(([raw])=>lower.endsWith(raw)&&lower.length>raw.length+2);
  const root=ROOTS.find(([raw])=>{
    const idx=lower.indexOf(raw);
    return idx>=0&&lower.length>raw.length+1&&(!prefix||idx>=prefix[0].length-1)&&(!suffix||idx+raw.length<=lower.length-suffix[0].length+1);
  });
  const parts=[];
  if(prefix)parts.push({piece:prefix[1],meaning:prefix[2],kind:'prefix'});
  if(root)parts.push({piece:root[0],meaning:root[1],kind:'root',family:root[2]});
  if(suffix)parts.push({piece:suffix[1],meaning:suffix[2],kind:'suffix'});
  const seen=new Set();
  return parts.filter(p=>{const key=p.kind+p.piece;if(seen.has(key))return false;seen.add(key);return true;});
}

function EtymologyBlock({word,meaning,et}){
  if(!et)return null;
  const parts=findMorphemes(word);
  const source=et.replace(/^(由来|継承|借用|構成):\s*/,'');
  return(
    <div className="etymology">
      <div className="et-title">{parts.length?'語源分解':'語源'}</div>
      {parts.length>0&&(
        <>
          <div className="et-parts">
            {parts.map((p,i)=>(
              <div className="et-part" key={i}>
                <div className="et-piece">{p.piece}</div>
                <div className="et-meaning">{p.meaning}</div>
              </div>
            ))}
          </div>
          <div className="et-hint">
            {parts.map(p=>p.meaning).join(' + ')} → {meaning||word}
          </div>
        </>
      )}
      <div className="et-source">由来: {source}</div>
    </div>
  );
}
function decodeImportedStore(){
  try{
    const raw=new URLSearchParams(location.search).get('import');
    if(!raw)return null;
    return expandImportedStore(JSON.parse(decodeURIComponent(escape(atob(raw)))));
  }catch{return null}
}
function encodeStoreForUrl(state){
  const s=normalizeStore(state);
  const compact={
    v:2,
    p:Object.keys(s.progress||{}).filter(id=>!!s.progress[id]),
    m:Object.keys(s.marked||{}).filter(id=>!!s.marked[id]),
    c:s.custom||[],
    d:s.dailyDate||'',
    n:Number(s.dailyCount)||0
  };
  return btoa(unescape(encodeURIComponent(JSON.stringify(compact))));
}
function cleanImportParam(){
  try{
    const url=new URL(location.href);
    if(!url.searchParams.has('import'))return;
    url.searchParams.delete('import');
    history.replaceState(null,'',url.pathname+(url.search?url.search:'')+url.hash);
  }catch{}
}
function load(){
  try{
    const d=localStorage.getItem(SK);
    const local=d?normalizeStore(JSON.parse(d)):emptyStore();
    const imported=decodeImportedStore();
    if(imported){
      const merged=mergeStores(local,imported);
      save(merged);
      cleanImportParam();
      return merged;
    }
    return local;
  }catch{return emptyStore()}
}
function save(d){try{localStorage.setItem(SK,JSON.stringify(d))}catch{}}
function hasLearningData(s){
  const n=normalizeStore(s);
  return Object.keys(n.progress).length>0||Object.keys(n.marked).length>0||n.custom.length>0;
}
async function getCloudState(){
  const res=await fetch('/api/vocab-state',{headers:{accept:'application/json'},cache:'no-store'});
  if(!res.ok)throw new Error(res.status===401?'ログインが必要です':'同期先に接続できません');
  return res.json();
}
async function putCloudState(state){
  const res=await fetch('/api/vocab-state',{method:'POST',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({state})});
  if(!res.ok)throw new Error('クラウド保存に失敗しました');
  return res.json();
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function speak(word,e){
  if(e){e.stopPropagation();}
  if(window.responsiveVoice){
    responsiveVoice.speak(word,'US English Female',{rate:0.9});
  } else {
    // フォールバック: Web Speech API
    if(!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(word);
    u.lang='en-US';u.rate=0.85;
    window.speechSynthesis.speak(u);
  }
}

function speakJa(text){
  if(!text)return;
  if(window.responsiveVoice){
    responsiveVoice.speak(text,'Japanese Female',{rate:0.85});
  } else {
    if(!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';u.rate=0.85;
    window.speechSynthesis.speak(u);
  }
}

const DAILY_GOAL=100;
function App(){

  const[sync,setSync]=useState({status:'checking',email:'',message:'同期確認中'});
  const syncTimer=useRef(null);
  const storeRef=useRef(store);
  useEffect(()=>{storeRef.current=store},[store]);
  useEffect(()=>{
    const fn=()=>setScrolled(window.scrollY>44);
    window.addEventListener('scroll',fn,{passive:true});
    return()=>window.removeEventListener('scroll',fn);
  },[]);
  const words=useMemo(()=>[...BASE_WORDS.map(normalizeWord),...(store.custom||[]).map(normalizeWord)],[store.custom]);
  const saveCloudNow=useCallback(async(data)=>{
    try{
      setSync(s=>({...s,status:'saving',message:'クラウド保存中'}));
      const result=await putCloudState(data);
      const saved=normalizeStore(result.state);
      setSync({status:'synced',email:result.email||'',message:'同期済み'});
      return saved;
    }catch(e){
      setSync(s=>({...s,status:'error',message:e.message||'同期できません'}));
      return null;
    }
  },[]);
  const queueCloudSave=useCallback((data)=>{
    if(syncTimer.current)clearTimeout(syncTimer.current);
    syncTimer.current=setTimeout(()=>saveCloudNow(data),700);
  },[saveCloudNow]);
  const persist=useCallback((next,{cloud=true}={})=>{
    const ns=normalizeStore(next);
    setStore(ns);
    save(ns);
    if(cloud)queueCloudSave(ns);
  },[queueCloudSave]);
  const syncFromCloud=useCallback(async({manual=false}={})=>{
    try{
      setSync(s=>({...s,status:'checking',message:manual?'同期中':'同期確認中'}));
      const result=await getCloudState();
      const local=storeRef.current;
      const merged=result.state?mergeStores(local,result.state):normalizeStore(local);
      persist(merged,{cloud:false});
      setSync({status:'synced',email:result.email||'',message:result.state?'同期済み':'初回同期準備済み'});
      if(!result.state&&hasLearningData(merged)){
        await saveCloudNow(merged);
      }else if(result.state&&JSON.stringify(merged)!==JSON.stringify(normalizeStore(result.state))){
        await saveCloudNow(merged);
      }
    }catch(e){
      setSync({status:'local',email:'',message:e.message||'端末内保存のみ'});
    }
  },[persist,saveCloudNow]);
  useEffect(()=>{syncFromCloud()},[syncFromCloud]);

  // 日別カウンター付きsetProgress
  const setProgress=useCallback(p=>{
    const today=todayStr();
    let dc=store.dailyDate===today?(store.dailyCount||0):0;
    // 増減を検出（新たに覚えた / 未習に戻した）
    const allIds=new Set([...Object.keys(p),...Object.keys(store.progress||{})]);
    for(const id of allIds){
      const was=!!(store.progress||{})[id];
      const now=!!p[id];
      if(!was&&now)dc++;
      if(was&&!now)dc=Math.max(0,dc-1);
    }
    const ns={...store,progress:p,dailyDate:today,dailyCount:dc};
    persist(ns);
  },[store,persist]);

  const addWord=useCallback(w=>{const nc=[...(store.custom||[]),w];const ns={...store,custom:nc};persist(ns)},[store,persist]);
  const setMarked=useCallback(m=>{const ns={...store,marked:m};persist(ns)},[store,persist]);
  const knownCount=Object.values(store.progress||{}).filter(Boolean).length;
  const dailyCount=store.dailyDate===todayStr()?(store.dailyCount||0):0;
  const needsCloudMigration=!location.hostname.includes('ielts-cbt-simulator-private.pages.dev');
  function migrateToCloud(){
    const url=CLOUDFLARE_VOCAB_URL+'?import='+encodeURIComponent(encodeStoreForUrl(store));
    location.href=url;
  }
  return(
    <div style={{maxWidth:480,margin:'0 auto',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <Nav tab={tab} setTab={setTab} known={knownCount} total={words.length} dailyCount={dailyCount} scrolled={scrolled} sync={sync} onSync={()=>syncFromCloud({manual:true})}/>
      {needsCloudMigration&&hasLearningData(store)&&(
        <div style={{margin:'10px 16px 0',padding:12,background:'#082f49',border:'1px solid #0ea5e9',borderRadius:12,color:'#e0f2fe'}}>
          <div style={{fontSize:12,fontWeight:800,marginBottom:6}}>Cloudflare同期へ移行できます</div>
          <div style={{fontSize:11,lineHeight:1.5,color:'#bae6fd',marginBottom:9}}>この端末の習得済み・マーク状態をCloudflare版へ引き継ぎます。</div>
          <button onClick={migrateToCloud} className="btn"
            style={{width:'100%',padding:'10px 12px',fontSize:12,fontWeight:800,
              background:'#0284c7',color:'#fff',border:'none',borderRadius:10,cursor:'pointer'}}>
            Cloudflare版へ移行
          </button>
        </div>
      )}
      <div style={{flex:1,paddingBottom:'calc(80px + env(safe-area-inset-bottom,16px))',overflow:'visible'}}>
        {tab==='flash'&&<Flash words={words} progress={store.progress} setProgress={setProgress} marked={store.marked||{}} setMarked={setMarked}/>}
        {tab==='quiz'&&<Quiz words={words} progress={store.progress} setProgress={setProgress}/>}
        {tab==='list'&&<List words={words} progress={store.progress} setProgress={setProgress} marked={store.marked||{}} setMarked={setMarked}/>}
        {tab==='add'&&<Add addWord={addWord} total={words.length}/>}
      </div>
    </div>
  );
}

// ===== FLASH CARD =====
function Flash({words,progress,setProgress,marked,setMarked}){
  const[filter,setFilter]=useState('all');
  const[dir,setDir]=useState('en');
  const[deck,setDeck]=useState(()=>shuffle(words));
  const[idx,setIdx]=useState(0);
  const[flipped,setFlipped]=useState(false);
  const[key,setKey]=useState(0);
  const[autoPlay,setAutoPlay]=useState(false);
  const[autoPhase,setAutoPhase]=useState(''); // 'en1','en2','ja1','ja2',''
  const timersRef=useRef([]);

  const pool=useMemo(()=>filter==='unknown'?deck.filter(w=>!progress[w.id]):filter==='marked'?deck.filter(w=>marked[w.id]):deck,[deck,filter,progress,marked]);
  const cur=pool[idx%Math.max(pool.length,1)];
  const isKnown=cur?!!progress[cur.id]:false;
  const isMarked=cur?!!marked[cur.id]:false;
  function toggleMark(){if(!cur)return;const m={...marked,[cur.id]:!marked[cur.id]};setMarked(m);}

  function clearAuto(){
    timersRef.current.forEach(clearTimeout);
    timersRef.current=[];
    if(window.responsiveVoice)responsiveVoice.cancel();
    else if(window.speechSynthesis)window.speechSynthesis.cancel();
    setAutoPhase('');
  }

  function go(known){
    if(!cur)return;
    if(known!==undefined){const p={...progress,[cur.id]:known};setProgress(p)}
    clearAuto();
    setFlipped(false);
    setTimeout(()=>{setIdx(i=>(i+1)%Math.max(pool.length,1));setKey(k=>k+1)},150);
  }

  // 自動再生シーケンス
  useEffect(()=>{
    if(!autoPlay||!cur)return;
    clearAuto();
    setFlipped(false);
    const add=(fn,d)=>{const id=setTimeout(fn,d);timersRef.current.push(id);};
    // 英語×2
    add(()=>{setAutoPhase('en1');speak(cur.w);},700);
    add(()=>{setAutoPhase('en2');speak(cur.w);},2700);
    // カード反転して日本語×2
    add(()=>{setFlipped(true);},4600);
    add(()=>{setAutoPhase('ja1');speakJa(cur.m||cur.w);},5200);
    add(()=>{setAutoPhase('ja2');speakJa(cur.m||cur.w);},8500);
    // 次へ
    add(()=>{
      setAutoPhase('');setFlipped(false);
      setTimeout(()=>{setIdx(i=>(i+1)%Math.max(pool.length,1));setKey(k=>k+1);},200);
    },12000);
    return()=>clearAuto();
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[autoPlay,idx,pool.length]);

  if(!cur||pool.length===0)return(
    <div style={{padding:40,textAlign:'center'}}>
      <div style={{fontSize:52,marginBottom:16}}>🎉</div>
      <div style={{fontSize:18,fontWeight:700,color:'#34d399',marginBottom:8}}>全単語クリア！</div>
      <button onClick={()=>setFilter('all')} className="btn"
        style={{background:'#e91e8c',color:'#fff',border:'none',borderRadius:12,padding:'12px 28px',fontWeight:700,cursor:'pointer',fontSize:14}}>
        全単語で再挑戦
      </button>
    </div>
  );

  return(
    <div style={{padding:'14px 16px'}}>
      {/* フィルター */}
      <div style={{display:'flex',gap:6,marginBottom:8}}>
        {[['all','全単語'],['unknown','未習得'],['marked','マーク']].map(([v,l])=>(
          <button key={v} onClick={()=>{setFilter(v);setIdx(0);setFlipped(false);clearAuto();}} className="btn"
            style={{flex:1,padding:'7px',fontSize:11,fontWeight:700,
              background:filter===v?(v==='marked'?'#7c3a1e':'#e91e8c'):'#1e293b',
              color:filter===v?'#fff':'#64748b',border:'none',borderRadius:8,cursor:'pointer'}}>
            {l}{v==='unknown'?` (${words.filter(w=>!progress[w.id]).length})`:v==='marked'?` (${words.filter(w=>marked[w.id]).length})`:''}
          </button>
        ))}
        <button onClick={()=>{setDir(d=>d==='en'?'ja':'en')}} className="btn"
          style={{padding:'7px 12px',fontSize:11,fontWeight:700,background:'#1e293b',
            color:'#94a3b8',border:'none',borderRadius:8,cursor:'pointer'}}>
          {dir==='en'?'英→日':'日→英'}
        </button>
        <button onClick={()=>{setDeck(shuffle(words));setIdx(0);setFlipped(false);clearAuto();}} className="btn"
          style={{padding:'7px 12px',background:'#1e293b',color:'#64748b',border:'none',borderRadius:8,cursor:'pointer',fontSize:14}}>
          🔀
        </button>
      </div>
      {/* 自動再生バー */}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
        <button onClick={()=>setAutoPlay(a=>!a)} className="btn"
          style={{flex:1,padding:'9px',fontSize:12,fontWeight:700,
            background:autoPlay?'#7c3aed':'#1e293b',
            color:autoPlay?'#fff':'#64748b',
            border:autoPlay?'2px solid #7c3aed':'2px solid #334155',
            borderRadius:10,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
          {autoPlay?'⏹ 停止':'▶ 自動再生'}
        </button>
        {autoPlay&&(
          <div style={{fontSize:11,color:'#94a3b8',background:'#1e293b',padding:'6px 10px',borderRadius:8,whiteSpace:'nowrap'}}>
            {autoPhase==='en1'?'🔊 英語①':autoPhase==='en2'?'🔊 英語②':autoPhase==='ja1'?'🔈 日本語①':autoPhase==='ja2'?'🔈 日本語②':'⏸ 待機中'}
          </div>
        )}
      </div>
      {/* カウンター */}
      <div style={{textAlign:'center',fontSize:11,color:'#475569',marginBottom:10}}>
        {(idx%pool.length)+1} / {pool.length}
        <span style={{marginLeft:8,color:'#475569'}}>#{String(cur.id).padStart(4,'0')}</span>
      </div>
      {/* カード */}
      <div className="card-scene" key={key} style={{marginBottom:16,overflow:'visible'}}>
        <div className={`card-body slide-up${flipped?' flipped':''}`}
          onClick={()=>setFlipped(f=>!f)} style={{minHeight:210,overflow:'visible'}}>
          {/* 表 */}
          <div className="card-face" style={{
            position:flipped?'absolute':'relative',width:'100%',minHeight:210,
            background:isMarked?'linear-gradient(145deg,#6d3a2a,#4a2218)':'linear-gradient(145deg,#1e293b,#0f172a)',
            borderRadius:20,border:isMarked?'1px solid #a0522d':'1px solid #334155',
            display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:28,textAlign:'center'}}>
            {isKnown&&<div style={{position:'absolute',top:14,right:16,fontSize:18}}>✅</div>}
            <button onClick={e=>{e.stopPropagation();toggleMark();}} className="btn"
              style={{position:'absolute',top:12,left:14,fontSize:13,fontWeight:700,
                background:isMarked?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.06)',
                color:isMarked?'#ffffff':'#64748b',border:'none',borderRadius:6,
                padding:'3px 8px',cursor:'pointer',lineHeight:1.4,transition:'all .2s'}}>
              {isMarked?'■ マーク済':'■ マーク'}
            </button>
            {dir==='en'?(
              <>
                <div style={{fontSize:34,fontWeight:800,color:'#ffffff',letterSpacing:.5,marginBottom:8}}>{cur.w}</div>
                <button onClick={e=>speak(cur.w,e)} className="btn"
                  style={{fontSize:22,background:'none',border:'none',cursor:'pointer',marginBottom:6,padding:'4px 12px',color:isMarked?'#ffcba4':'#94a3b8'}}>🔊</button>
                <div style={{fontSize:12,color:isMarked?'rgba(255,255,255,0.4)':'#334155'}}>タップして意味を確認 👆</div>
              </>
            ):(
              <>
                <div style={{fontSize:22,fontWeight:700,color:'#ffffff',marginBottom:8}}>{cur.m||'(意味未設定)'}</div>
                {cur.s&&<div style={{fontSize:12,color:isMarked?'#ffcba4':'#e91e8c'}}>≒ {cur.s}</div>}
                <div style={{fontSize:12,color:isMarked?'rgba(255,255,255,0.4)':'#334155',marginTop:8}}>タップして単語を確認 👆</div>
              </>
            )}
          </div>
          {/* 裏 */}
          <div className="card-face card-back" style={{
            position:flipped?'relative':'absolute',top:0,width:'100%',minHeight:240,
            background:'linear-gradient(145deg,#1a0a2e,#0f0a1e)',
            borderRadius:20,border:'1px solid #e91e8c44',
            display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'18px 22px',textAlign:'center',overflow:'visible'}}>
            {dir==='en'?(
              <>
                <div style={{fontSize:21,fontWeight:700,color:'#f1f5f9',marginBottom:4,lineHeight:1.4}}>{cur.m||<span style={{color:'#475569'}}>意味未登録</span>}</div>
                {cur.s&&<div style={{fontSize:12,color:'#e91e8c',marginBottom:6}}>≒ {cur.s}</div>}
                <EtymologyBlock word={cur.w} meaning={cur.m} et={cur.et}/>
                {cur.e&&(
                  <div style={{marginTop:6,padding:'10px 12px',background:'#000000',borderRadius:8,borderLeft:'3px solid #e91e8c',textAlign:'left',width:'100%'}}>
                    <div style={{fontSize:9,color:'#e91e8c',marginBottom:3,letterSpacing:.8,fontWeight:700}}>EXAMPLE</div>
                    <div style={{fontSize:16,color:'#ffffff',lineHeight:1.7,fontStyle:'italic'}}>{cur.e}</div>
                    {cur.ej&&<div style={{fontSize:13,color:'#e2e8f0',lineHeight:1.6,marginTop:6}}>{cur.ej}</div>}
                  </div>
                )}
              </>
            ):(
              <>
                <div style={{fontSize:30,fontWeight:800,color:'#f8fafc',letterSpacing:.5,marginBottom:6}}>{cur.w}</div>

                  style={{fontSize:20,background:'none',border:'none',cursor:'pointer',padding:'4px 12px',color:'#94a3b8',marginBottom:4}}>🔊</button>
                <EtymologyBlock word={cur.w} meaning={cur.m} et={cur.et}/>
