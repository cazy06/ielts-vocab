// ===== QUIZ =====
function Quiz({words,progress,setProgress}){
  const[state,setState]=useState('idle');
  const[qs,setQs]=useState([]);
  const[qi,setQi]=useState(0);
  const[sel,setSel]=useState(null);
  const[score,setScore]=useState(0);
  const[shake,setShake]=useState(false);
  const[dir,setDir]=useState('en2ja');

  function start(){
    const pool=shuffle(words).slice(0,Math.min(10,words.length));
    const questions=pool.map(w=>{
      const wrongs=shuffle(words.filter(x=>x.id!==w.id)).slice(0,3);
      return{word:w,options:shuffle([w,...wrongs])};
    });
    setQs(questions);setQi(0);setSel(null);setScore(0);setState('playing');
  }

  function pick(opt){
    if(sel)return;
    setSel(opt);
    const ok=opt.id===qs[qi].word.id;
    if(ok){setScore(s=>s+1);const p={...progress,[qs[qi].word.id]:true};setProgress(p)}
    else{setShake(true);setTimeout(()=>setShake(false),500)}
    setTimeout(()=>{
      if(qi+1>=qs.length)setState('result');
      else{setQi(i=>i+1);setSel(null)}
    },900);
  }

  if(state==='idle')return(
    <div style={{padding:'32px 20px',textAlign:'center'}}>
      <div style={{fontSize:52,marginBottom:16}}>📝</div>
      <div style={{fontSize:20,fontWeight:800,marginBottom:6}}>クイズモード</div>
      <div style={{color:'#64748b',fontSize:13,marginBottom:28}}>ランダム10問・4択で答えましょう</div>
      <div style={{display:'flex',gap:8,marginBottom:28}}>
        {[['en2ja','英 → 日'],['ja2en','日 → 英']].map(([v,l])=>(
          <button key={v} onClick={()=>setDir(v)} className="btn"
            style={{flex:1,padding:'10px',fontSize:13,fontWeight:700,
              background:dir===v?'#e91e8c':'#1e293b',color:dir===v?'#fff':'#64748b',
              border:'none',borderRadius:10,cursor:'pointer'}}>{l}</button>
        ))}
      </div>
      <button onClick={start} className="btn"
        style={{background:'linear-gradient(135deg,#e91e8c,#f43f5e)',color:'#fff',border:'none',
          borderRadius:14,padding:'16px 48px',fontWeight:800,fontSize:16,cursor:'pointer'}}>
        スタート
      </button>
    </div>
  );

  if(state==='result'){
    const pct=Math.round(score/qs.length*100);
    return(
      <div style={{padding:'40px 20px',textAlign:'center'}}>
        <div style={{fontSize:52,marginBottom:16}}>{pct>=80?'🎉':pct>=50?'💪':'📚'}</div>
        <div style={{fontSize:22,fontWeight:800,marginBottom:6}}>結果</div>
        <div style={{fontSize:52,fontWeight:900,color:'#e91e8c'}}>{score}<span style={{fontSize:22,color:'#475569'}}>/{qs.length}</span></div>
        <div style={{fontSize:13,color:'#475569',marginBottom:32}}>正答率 {pct}%</div>
        <button onClick={()=>setState('idle')} className="btn"
          style={{background:'linear-gradient(135deg,#e91e8c,#f43f5e)',color:'#fff',border:'none',
            borderRadius:14,padding:'14px 40px',fontWeight:700,fontSize:15,cursor:'pointer'}}>
          もう一度
        </button>
      </div>
    );
  }

  const q=qs[qi];
  return(
    <div style={{padding:'14px 16px'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16}}>
        <div style={{flex:1}}><div className="progress-bar"><div className="progress-fill" style={{width:`${qi/qs.length*100}%`}}/></div></div>
        <div style={{fontSize:11,color:'#475569'}}>{qi+1}/{qs.length}</div>
      </div>
      <div style={{
        background:'linear-gradient(145deg,#1e293b,#0f172a)',borderRadius:16,padding:'28px 20px',
        textAlign:'center',marginBottom:20,border:'1px solid #334155',
        animation:shake?'shake .4s ease':'none'}}>
        {dir==='en2ja'?(
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
            <div style={{fontSize:34,fontWeight:800,color:'#f8fafc'}}>{q.word.w}</div>
            <button onClick={e=>{e.stopPropagation();speak(q.word.w)}} className="btn"
              style={{fontSize:20,background:'none',border:'none',cursor:'pointer',padding:'4px',color:'#94a3b8'}}>🔊</button>
          </div>
        ):(
          <div style={{fontSize:22,fontWeight:700,color:'#f8fafc',lineHeight:1.4}}>{q.word.m}</div>
        )}
        <div style={{fontSize:11,color:'#334155',marginTop:6}}>#{String(q.word.id).padStart(4,'0')}</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        {q.options.map(opt=>{
          const correct=opt.id===q.word.id;
          const picked=sel?.id===opt.id;
          let bg='#1e293b',border='#334155',col='#f1f5f9';
          if(sel){
            if(correct){bg='#14532d33';border='#34d399';col='#34d399'}
            else if(picked){bg='#450a0a33';border='#f87171';col='#f87171'}
          }
          return(
            <button key={opt.id} onClick={()=>pick(opt)} className="btn"
              style={{padding:'13px 10px',fontSize:13,fontWeight:600,
                background:bg,color:col,border:`2px solid ${border}`,
                borderRadius:12,cursor:sel?'default':'pointer',
                transition:'all .2s',lineHeight:1.3,minHeight:60}}>
              {dir==='en2ja'?opt.m||'(意味未設定)':opt.w}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ===== LIST =====
function List({words,progress,setProgress,marked,setMarked}){
  const[search,setSearch]=useState('');
  const[filter,setFilter]=useState('all');
  const filtered=words.filter(w=>{
    const s=search.toLowerCase();
    const match=w.w.toLowerCase().includes(s)||w.m.includes(s);
    const flt=filter==='all'||(filter==='known'?progress[w.id]:filter==='unknown'?!progress[w.id]:marked[w.id]);
    return match&&flt;
  });
  function toggle(id){const p={...progress,[id]:!progress[id]};setProgress(p)}
  function toggleMark(id){const m={...marked,[id]:!marked[id]};setMarked(m)}
  const counts={known:words.filter(w=>progress[w.id]).length,unknown:words.filter(w=>!progress[w.id]).length,marked:words.filter(w=>marked[w.id]).length};
  return(
    <div>
      <div style={{padding:'12px 16px 0'}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍  単語・意味で検索..."
          style={{width:'100%',padding:'10px 14px',fontSize:13,
            background:'#1e293b',color:'#f1f5f9',border:'1px solid #334155',
            borderRadius:10,outline:'none'}}/>
      </div>
      <div style={{display:'flex',gap:6,padding:'10px 16px',flexWrap:'wrap'}}>
        {[['all',`全て(${words.length})`],['known',`習得(${counts.known})`],['unknown',`未習得(${counts.unknown})`],['marked',`マーク(${counts.marked})`]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} className="btn"
            style={{padding:'5px 12px',fontSize:10,fontWeight:700,
              background:filter===v?(v==='marked'?'#7c3a1e':'#e91e8c'):'#1e293b',
              color:filter===v?'#fff':'#64748b',border:'none',borderRadius:20,cursor:'pointer'}}>
            {l}
          </button>
        ))}
      </div>
      <div style={{paddingBottom:80}}>
        {filtered.map(w=>{
          const mk=!!marked[w.id];
          return(
          <div key={w.id} style={{
            padding:'12px 16px',borderBottom:'1px solid #1e293b',
            display:'flex',alignItems:'flex-start',gap:12,
            background:mk?'#6d3a2a':progress[w.id]?'#0a130a':'#0f172a',
            transition:'background .2s'}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3,flexWrap:'wrap'}}>
                <span style={{fontSize:9,color:mk?'rgba(255,255,255,0.4)':'#334155',fontFamily:'monospace'}}>#{String(w.id).padStart(4,'0')}</span>
                <span style={{fontSize:16,fontWeight:700,color:'#ffffff'}}>{w.w}</span>
                <button onClick={e=>{e.stopPropagation();speak(w.w)}} className="btn"
                  style={{fontSize:13,background:'none',border:'none',cursor:'pointer',padding:'0 2px',color:mk?'#ffcba4':'#475569',lineHeight:1}}>🔊</button>
              </div>
              <div style={{fontSize:13,color:mk?'#fce8d8':'#cbd5e1',lineHeight:1.4}}>{w.m||<span style={{color:mk?'rgba(255,255,255,0.4)':'#334155'}}>意味未設定</span>}</div>
              {w.s&&<div style={{fontSize:11,color:mk?'#ffcba4':'#e91e8c',marginTop:2}}>≒ {w.s}</div>}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4,alignItems:'center',flexShrink:0}}>
              <button onClick={()=>toggleMark(w.id)} className="btn"
                title="マーカー"
                style={{fontSize:14,background:'none',border:'none',cursor:'pointer',
                  color:mk?'#ffffff':'#475569',opacity:mk?1:0.3,
                  transition:'all .2s',padding:'2px 4px',lineHeight:1}}>
                ■
              </button>
              <button onClick={()=>toggle(w.id)} className="btn"
                style={{fontSize:18,background:'none',border:'none',cursor:'pointer',
                  opacity:progress[w.id]?1:.2,transition:'opacity .2s',padding:'2px',lineHeight:1}}>
                ✅
              </button>
            </div>
          </div>
        );})}
        {filtered.length===0&&(
          <div style={{padding:40,textAlign:'center',color:'#334155'}}>該当する単語がありません</div>
        )}
      </div>
    </div>
  );
}

// ===== ADD =====
function Add({addWord,total}){
  const[w,setW]=useState('');
  const[m,setM]=useState('');
  const[s,setS]=useState('');
  const[et,setEt]=useState('');
  const[ok,setOk]=useState(false);

  function submit(){
    if(!w.trim()||!m.trim())return;
    addWord({id:Date.now(),w:w.trim(),m:m.trim(),s:s.trim(),et:et.trim()});
    setW('');setM('');setS('');setEt('');setOk(true);setTimeout(()=>setOk(false),2000);
  }

  const inp={width:'100%',padding:'11px 14px',fontSize:13,
    background:'#1e293b',color:'#f1f5f9',border:'1px solid #334155',
    borderRadius:10,outline:'none',marginBottom:10};
  return(
    <div style={{padding:'16px'}}>
      <div style={{fontSize:14,fontWeight:700,color:'#e91e8c',marginBottom:16}}>📥 単語を追加</div>
      <div style={{fontSize:11,color:'#475569',marginBottom:4}}>英単語 *</div>
      <input value={w} onChange={e=>setW(e.target.value)} placeholder="例: sustainable" style={inp}/>
      <div style={{fontSize:11,color:'#475569',marginBottom:4}}>日本語の意味 *</div>
      <input value={m} onChange={e=>setM(e.target.value)} placeholder="例: 持続可能な" style={inp}/>
      <div style={{fontSize:11,color:'#475569',marginBottom:4}}>類義語（任意）</div>
      <input value={s} onChange={e=>setS(e.target.value)} placeholder="例: eco-friendly" style={inp}/>
      <div style={{fontSize:11,color:'#475569',marginBottom:4}}>語源（任意）</div>
      <textarea value={et} onChange={e=>setEt(e.target.value)} placeholder="例: ラテン語 'sustinere'（支える）より"
        style={{...inp,minHeight:72,resize:'vertical',lineHeight:1.5}}/>
      <button onClick={submit} disabled={!w.trim()||!m.trim()} className="btn"
        style={{width:'100%',padding:'14px',fontSize:14,fontWeight:700,marginTop:4,
          background:(w.trim()&&m.trim())?'linear-gradient(135deg,#e91e8c,#f43f5e)':'#1e293b',
          color:(w.trim()&&m.trim())?'#fff':'#475569',
          border:'none',borderRadius:14,cursor:'pointer',transition:'all .2s'}}>
        ＋ 追加する
      </button>
      {ok&&<div style={{marginTop:12,padding:'11px',background:'#14532d33',border:'1px solid #34d399',
        borderRadius:10,color:'#34d399',fontSize:12,fontWeight:600,textAlign:'center',
        animation:'slideUp .3s ease'}}>✅ 追加しました！</div>}
      <div style={{marginTop:24,padding:16,background:'#1e293b',borderRadius:12,fontSize:12,
        color:'#64748b',lineHeight:1.8,border:'1px solid #334155'}}>
        <div style={{fontWeight:700,color:'#94a3b8',marginBottom:6}}>📊 現在の収録状況</div>
        <div>収録語数：<strong style={{color:'#e91e8c'}}>{total}語</strong>（動画OCR収録）</div>
        <div style={{marginTop:4}}>Kindleで単語を見ながらここに追加すると<br/>フラッシュカードとクイズに反映されます</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
